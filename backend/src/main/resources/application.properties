server.port=8080
spring.datasource.url=jdbc:h2:file:./data/pdd
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# В разработке раздаём фронтенд прямо из ../web (запуск из папки backend)
spring.web.resources.static-locations=file:../web/,classpath:/static/
# В продакшене укажите домен вместо *
pdd.cors=*
