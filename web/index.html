<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-192.png">
<title>Дорога домой 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head><body>
<canvas id="c"></canvas>
<div id="menu" class="ui">
 <div class="tl box">👤 <b id="nm">Водитель</b> · ур. <span id="lv"></span><br>🪙 <span id="mo"></span> ₸</div>
 <div class="tr box">Поездок: <b id="s1"></b> · Чистых: <b id="s2"></b><br>Штрафов: <b id="s3"></b> · Заработано: <b id="s4"></b> ₸</div>
 <button class="ar" id="pv" style="left:6px">◀</button><button class="ar" id="nx" style="right:6px">▶</button>
 <div class="bc box"><h2 id="cn"></h2><p id="cd"></p><div class="row" id="ca"></div><div class="row" id="lc"></div>
  <div class="row"><button class="b go" id="play">Играть</button><button class="b" id="lbb">🏆 Рейтинг</button><button class="b" id="book">📖 Знаки ПДД</button><button class="b" id="gear">⚙ Настройки</button></div></div>
</div>
<div id="game" class="ui hide"><div id="hud">
 <div class="box chip">⚖️ Закон <b id="hL"></b></div><div class="box chip">🪙 <b id="hM"></b></div><div class="box chip">⛽ <b id="hF"></b></div>
 <div class="box chip" id="hZ"></div><div id="lim" class="box"></div>
 <button class="b box chip" id="vw">📷 Вид</button><button class="b box chip" id="ex">✖ Выйти</button></div>
 <div id="panel" class="box hide"><div id="who"></div><div id="ttl"></div><p id="txt"></p><div id="opts"></div></div></div>
<div id="toast"></div>
<div id="end" class="scr hide"><div id="ed" style="font-size:46px"></div><h1 id="et"></h1><p id="ex2" style="max-width:440px;margin:0"></p><div id="log" style="max-width:440px;text-align:left;color:var(--mut)"></div><button class="b go" id="back">В гараж</button></div>
<div id="set" class="scr hide"><h1>НАСТРОЙКИ</h1>
 <div class="row">Вид по умолчанию: <button class="b" data-c="3d">3D</button><button class="b" data-c="2d">2D сверху</button></div>
 <div class="row">Графика: <button class="b" data-q="1">Высокая</button><button class="b" data-q="0">Лёгкая</button></div>
 <div class="row">Погода: <button class="b" data-w="clear">☀️ Ясно</button><button class="b" data-w="rain">🌧 Дождь</button><button class="b" data-w="night">🌙 Ночь</button></div>
 <div class="row">Цвет машины: <span id="sw" class="row"></span></div>
 <div class="row"><button class="b" id="rst">Сбросить прогресс</button><button class="b go" id="sx">Готово</button></div></div>
<div id="hb" class="scr hide"><h1>ЗНАКИ ПДД</h1><div id="hbl" style="display:grid;gap:8px;max-width:520px;width:100%"></div><button class="b go" id="hbx">Закрыть</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="data/events.js"></script>
<script src="data/models.js"></script>
<script src="src/game.js"></script>
<script src="src/handbook.js"></script>
<script src="config.js"></script>
<script src="src/cloud.js"></script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
<div id="lb" class="scr hide"><h1>РЕЙТИНГ</h1><div id="lbl" style="display:grid;gap:8px;max-width:520px;width:100%"></div><button class="b go" id="lbx">Закрыть</button></div>
</body></html>
